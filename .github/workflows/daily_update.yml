name: 每日更新监控数据

on:
  schedule:
    # 每天只跑一次（时间随意，这里取 UTC 16:00 ≈ 北京时间 00:00）
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fontconfig
          fc-cache -f -v
          pip install pandas numpy matplotlib requests

      - name: 生成监控页面
        run: python .github/workflows/generate_page.py

      - name: 同步完整 index.html 到 main 分支（供 EdgeOne Pages 检出）
        run: |
          # 数据有效性守卫：关键产物必须存在、非空且 JSON 合法。
          # 不做「必须是今天」的判定：节假日 / 披露滞后属正常（见 README 维护须知）。
          for f in public/index.html; do
            test -s "$f" || { echo "::error::守卫失败：$f 缺失或为空"; exit 1; }
            case "$f" in *.json) python3 -m json.tool "$f" >/dev/null || { echo "::error::$f 不是合法 JSON"; exit 1; } ;; esac
          done
          echo "数据有效性守卫通过"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只跟踪 public/index.html，其他 public 产物不纳入
          git add -f public/index.html
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "chore: 每日更新监控页面 (auto-commit for EdgeOne Pages)"
            git push origin main
          fi

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5